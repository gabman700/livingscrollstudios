# Publishes the static site to GitHub Pages through GitHub Actions.
# Build runs on every push to main and on manual dispatch. The deploy job uses the
# "github-pages" environment, which requires explicit approval (required reviewer)
# before anything goes live. Merging to main alone does not publish.
name: deploy-pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        # Copies the publishable site (HTML, CSS, JS, images, CNAME, privacy page, etc.).
        # Excludes git metadata, workflow files and local scratch folders.
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.pr-staging' \
            --exclude='node_modules' \
            --exclude='_site' \
            ./ _site/
          test -f _site/index.html
          test -f _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    # Waits for required-reviewer approval in the github-pages environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
